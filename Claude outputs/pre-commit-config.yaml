# Tools run from the project's own lockfiles (uv.lock, web/package-lock.json), so a
# hook can never disagree with CI about the ruff/mypy/tsc version.
# Recorded API responses and vendored font files are kept byte-exact.
exclude: ^(tests/fixtures/|docs/assets/fonts/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # syntax only: mkdocs.yml uses a !!python tag for slugify
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, autofix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: web-typecheck
        name: tsc (web panel)
        entry: npm --prefix web run typecheck
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
