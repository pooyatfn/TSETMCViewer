<svg class="dg" viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Monitoring and alerting architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root {
      --bg:#f7fafb; --surface:#ffffff; --line:#9fb6bc; --text:#16303a; --muted:#5b7680;
      --src:#e9f3ee; --src-line:#58a37b; --core:#e3eff2; --core-line:#2c7486;
      --store:#fbf0dd; --store-line:#d98e1f; --serve:#efeaf7; --serve-line:#7a62b3;
      --arrow:#5b7680; --hot:#d98e1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#151f24; --surface:#1b272d; --line:#3c525a; --text:#e2ecef; --muted:#9ab0b7;
        --src:#16302a; --src-line:#5cc48a; --core:#15313a; --core-line:#4fb3c4;
        --store:#33291a; --store-line:#f0b04f; --serve:#262036; --serve-line:#a58ee0;
        --arrow:#8aa3ab; --hot:#f0b04f;
      }
    }
    .dg-bg   { fill: var(--bg); }
    text     { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); direction: ltr; unicode-bidi: plaintext; }
    .t-title { font-size: 16px; font-weight: 700; }
    .t-body  { font-size: 13px; }
    .t-small { font-size: 11.5px; fill: var(--muted); }
    .t-mono  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--muted); direction: ltr; }
    .t-zone  { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .02em; }
    .box     { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .src     { fill: var(--src);   stroke: var(--src-line);   stroke-width: 1.4; }
    .core    { fill: var(--core);  stroke: var(--core-line);  stroke-width: 1.4; }
    .store   { fill: var(--store); stroke: var(--store-line); stroke-width: 1.4; }
    .serve   { fill: var(--serve); stroke: var(--serve-line); stroke-width: 1.4; }
    .zone    { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
    .edge    { fill: none; stroke: var(--arrow); stroke-width: 1.5; }
    .edge.dash { stroke-dasharray: 5 4; }
    .edge.hot  { stroke: var(--hot); stroke-width: 2; }
    .arrowhead { fill: var(--arrow); }
    .arrowhead.hot { fill: var(--hot); }
    .bar-src   { fill: var(--src-line); }
    .bar-core  { fill: var(--core-line); }
    .bar-store { fill: var(--store-line); }
    .bar-serve { fill: var(--serve-line); }
    .grid-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>
  <rect class="dg-bg" x="0" y="0" width="960" height="440" rx="16"/>
  <defs>
    <marker id="mon-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="mon-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead hot" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <!-- zones -->
  <rect class="zone" x="10" y="30" width="215" height="330" rx="14"/>
  <text class="t-zone" x="118" y="52" text-anchor="middle">SERVICES (/METRICS)</text>
  <rect class="zone" x="265" y="30" width="270" height="330" rx="14"/>
  <text class="t-zone" x="400" y="52" text-anchor="middle">COLLECTION AND RULES</text>
  <rect class="zone" x="575" y="30" width="375" height="400" rx="14"/>
  <text class="t-zone" x="763" y="52" text-anchor="middle">DISPLAY AND ALERTING</text>
  <!-- services -->
  <rect class="core" x="25" y="70" width="185" height="80" rx="10"/>
  <text class="t-title" x="118" y="96" text-anchor="middle">collector × 2</text>
  <text class="t-small" x="118" y="116" text-anchor="middle">One leader, one standby</text>
  <text class="t-mono" x="118" y="136" text-anchor="middle">:9108/metrics</text>
  <rect class="serve" x="25" y="165" width="185" height="80" rx="10"/>
  <text class="t-title" x="118" y="191" text-anchor="middle">API</text>
  <text class="t-small" x="118" y="211" text-anchor="middle">Merges all workers into one output</text>
  <text class="t-mono" x="118" y="231" text-anchor="middle">:8000/metrics</text>
  <rect class="store" x="25" y="260" width="185" height="80" rx="10"/>
  <text class="t-title" x="118" y="286" text-anchor="middle">ClickHouse</text>
  <text class="t-small" x="118" y="306" text-anchor="middle">The database's own built-in exporter</text>
  <text class="t-mono" x="118" y="326" text-anchor="middle">:9363/metrics</text>
  <!-- prometheus -->
  <rect class="core" x="285" y="120" width="230" height="170" rx="12"/>
  <text class="t-title" x="400" y="152" text-anchor="middle">Prometheus</text>
  <text class="t-body" x="400" y="180" text-anchor="middle">Scrapes everything every 15 seconds</text>
  <text class="t-body" x="400" y="204" text-anchor="middle">16 alerts and 4 recording rules</text>
  <text class="t-body" x="400" y="228" text-anchor="middle">Alerts have unit tests</text>
  <text class="t-small" x="400" y="254" text-anchor="middle">30-day retention</text>
  <!-- display & alerting -->
  <rect class="serve" x="595" y="70" width="335" height="90" rx="12"/>
  <text class="t-title" x="763" y="100" text-anchor="middle">Grafana</text>
  <text class="t-body" x="763" y="124" text-anchor="middle">4 dashboards: overview, ingestion, API, ClickHouse</text>
  <text class="t-small" x="763" y="146" text-anchor="middle">Dashboards are code and load automatically</text>
  <rect class="src" x="595" y="190" width="335" height="80" rx="12"/>
  <text class="t-title" x="763" y="220" text-anchor="middle">Alertmanager</text>
  <text class="t-small" x="763" y="244" text-anchor="middle">Groups alerts; a root cause silences its symptoms</text>
  <rect class="core" x="595" y="300" width="335" height="70" rx="12"/>
  <text class="t-title" x="763" y="328" text-anchor="middle">alert-relay</text>
  <text class="t-small" x="763" y="352" text-anchor="middle">Persian message with a fix link; secrets stay in .env</text>
  <text class="t-body" x="763" y="410" text-anchor="middle">Bale · Telegram · any webhook</text>
  <!-- edges -->
  <path class="edge" d="M210,110 L283,170" marker-end="url(#mon-a)"/>
  <path class="edge" d="M210,205 L283,205" marker-end="url(#mon-a)"/>
  <path class="edge" d="M210,300 L283,240" marker-end="url(#mon-a)"/>
  <path class="edge" d="M515,160 C550,160 560,115 593,115" marker-end="url(#mon-a)"/>
  <path class="edge hot" d="M515,250 C550,250 560,230 593,230" marker-end="url(#mon-h)"/>
  <path class="edge hot" d="M763,270 L763,298" marker-end="url(#mon-h)"/>
  <path class="edge hot" d="M763,370 L763,392" marker-end="url(#mon-h)"/>
</svg>
