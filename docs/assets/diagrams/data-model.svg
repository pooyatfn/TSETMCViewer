<svg class="dg" viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data model" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root {
      --bg:#f7fafb; --surface:#ffffff; --line:#9fb6bc; --text:#16303a; --muted:#5b7680;
      --src:#e9f3ee; --src-line:#58a37b; --core:#e3eff2; --core-line:#2c7486;
      --store:#fbf0dd; --store-line:#d98e1f; --serve:#efeaf7; --serve-line:#7a62b3;
      --arrow:#5b7680; --hot:#d98e1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#151f24; --surface:#1b272d; --line:#3c525a; --text:#e2ecef; --muted:#9ab0b7;
        --src:#16302a; --src-line:#5cc48a; --core:#15313a; --core-line:#4fb3c4;
        --store:#33291a; --store-line:#f0b04f; --serve:#262036; --serve-line:#a58ee0;
        --arrow:#8aa3ab; --hot:#f0b04f;
      }
    }
    .dg-bg   { fill: var(--bg); }
    text     { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); direction: ltr; unicode-bidi: plaintext; }
    .t-title { font-size: 16px; font-weight: 700; }
    .t-body  { font-size: 13px; }
    .t-small { font-size: 11.5px; fill: var(--muted); }
    .t-mono  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--muted); direction: ltr; }
    .t-zone  { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .02em; }
    .box     { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .src     { fill: var(--src);   stroke: var(--src-line);   stroke-width: 1.4; }
    .core    { fill: var(--core);  stroke: var(--core-line);  stroke-width: 1.4; }
    .store   { fill: var(--store); stroke: var(--store-line); stroke-width: 1.4; }
    .serve   { fill: var(--serve); stroke: var(--serve-line); stroke-width: 1.4; }
    .zone    { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
    .edge    { fill: none; stroke: var(--arrow); stroke-width: 1.5; }
    .edge.dash { stroke-dasharray: 5 4; }
    .edge.hot  { stroke: var(--hot); stroke-width: 2; }
    .arrowhead { fill: var(--arrow); }
    .arrowhead.hot { fill: var(--hot); }
    .bar-src   { fill: var(--src-line); }
    .bar-core  { fill: var(--core-line); }
    .bar-store { fill: var(--store-line); }
    .bar-serve { fill: var(--serve-line); }
    .grid-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>
  <rect class="dg-bg" x="0" y="0" width="960" height="470" rx="16"/>
  <defs>
    <marker id="dm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <!-- column labels -->
  <text class="t-zone" x="120" y="24" text-anchor="middle">REFERENCE (DAILY)</text>
  <text class="t-zone" x="440" y="24" text-anchor="middle">TIME SERIES (MINUTE-LEVEL)</text>
  <text class="t-zone" x="800" y="24" text-anchor="middle">OPERATIONS AND AUDIT</text>
  <!-- funds -->
  <rect class="src" x="20" y="40" width="200" height="170" rx="10"/>
  <text class="t-title" x="120" y="64" text-anchor="middle">funds</text>
  <text class="t-small" x="120" y="82" text-anchor="middle">ReplacingMergeTree(updated_at)</text>
  <line class="grid-line" x1="35" y1="92" x2="205" y2="92"/>
  <text class="t-mono" x="120" y="112" text-anchor="middle">PK  ins_code</text>
  <text class="t-mono" x="120" y="130" text-anchor="middle">symbol · name · isin</text>
  <text class="t-mono" x="120" y="148" text-anchor="middle">fund_type · market · board</text>
  <text class="t-mono" x="120" y="166" text-anchor="middle">is_active</text>
  <text class="t-small" x="120" y="194" text-anchor="middle">A new version on every sync</text>
  <!-- fund_daily -->
  <rect class="src" x="20" y="240" width="200" height="140" rx="10"/>
  <text class="t-title" x="120" y="264" text-anchor="middle">fund_daily</text>
  <text class="t-small" x="120" y="282" text-anchor="middle">ReplacingMergeTree(updated_at)</text>
  <line class="grid-line" x1="35" y1="292" x2="205" y2="292"/>
  <text class="t-mono" x="120" y="312" text-anchor="middle">PK  ins_code, trade_date</text>
  <text class="t-mono" x="120" y="330" text-anchor="middle">units · net_assets</text>
  <text class="t-mono" x="120" y="348" text-anchor="middle">*_weight (reserved)</text>
  <!-- fund_ticks -->
  <rect class="core" x="320" y="40" width="240" height="250" rx="10"/>
  <text class="t-title" x="440" y="64" text-anchor="middle">fund_ticks</text>
  <text class="t-small" x="440" y="82" text-anchor="middle">ReplacingMergeTree(ingested_at) · monthly</text>
  <line class="grid-line" x1="335" y1="92" x2="545" y2="92"/>
  <text class="t-mono" x="440" y="112" text-anchor="middle">PK  ins_code, ts</text>
  <text class="t-mono" x="440" y="132" text-anchor="middle">last · close · open · high · low</text>
  <text class="t-mono" x="440" y="150" text-anchor="middle">volume · value · trade_count</text>
  <text class="t-mono" x="440" y="168" text-anchor="middle">block_volume · block_value</text>
  <text class="t-mono" x="440" y="186" text-anchor="middle">nav_redemption · nav_subscription</text>
  <text class="t-mono" x="440" y="204" text-anchor="middle">nav_at · bid · ask (price, volume)</text>
  <text class="t-mono" x="440" y="222" text-anchor="middle">ind/inst · buy/sell · vol/value/count</text>
  <text class="t-mono" x="440" y="240" text-anchor="middle">quality_flags · run_id</text>
  <text class="t-small" x="440" y="272" text-anchor="middle">One row per fund per minute</text>
  <!-- market_ticks -->
  <rect class="core" x="320" y="320" width="240" height="110" rx="10"/>
  <text class="t-title" x="440" y="344" text-anchor="middle">market_ticks</text>
  <text class="t-small" x="440" y="362" text-anchor="middle">ReplacingMergeTree(ingested_at)</text>
  <text class="t-mono" x="440" y="384" text-anchor="middle">PK  ts</text>
  <text class="t-mono" x="440" y="402" text-anchor="middle">index_value · eq_index_value · state</text>
  <!-- ops -->
  <rect class="store" x="670" y="40" width="260" height="110" rx="10"/>
  <text class="t-title" x="800" y="64" text-anchor="middle">collection_runs</text>
  <text class="t-small" x="800" y="82" text-anchor="middle">MergeTree</text>
  <text class="t-mono" x="800" y="104" text-anchor="middle">run_id · tick · status</text>
  <text class="t-mono" x="800" y="122" text-anchor="middle">expected_funds · received_funds</text>
  <rect class="store" x="670" y="175" width="260" height="115" rx="10"/>
  <text class="t-title" x="800" y="199" text-anchor="middle">raw_snapshots</text>
  <text class="t-small" x="800" y="217" text-anchor="middle">MergeTree · ZSTD · daily · 30-day TTL</text>
  <text class="t-mono" x="800" y="239" text-anchor="middle">run_id · endpoint · ins_code</text>
  <text class="t-mono" x="800" y="257" text-anchor="middle">status_code · latency_ms · payload</text>
  <rect class="store" x="670" y="320" width="260" height="110" rx="10"/>
  <text class="t-title" x="800" y="344" text-anchor="middle">data_quality_log</text>
  <text class="t-small" x="800" y="362" text-anchor="middle">MergeTree · 180-day TTL</text>
  <text class="t-mono" x="800" y="384" text-anchor="middle">run_id · ins_code · check</text>
  <text class="t-mono" x="800" y="402" text-anchor="middle">severity · action · detail</text>
  <!-- relations -->
  <path class="edge" d="M220,112 L318,112" marker-end="url(#dm-a)"/>
  <text class="t-small" x="269" y="104" text-anchor="middle">ins_code</text>
  <path class="edge dash" d="M220,312 L260,312 L260,140 L318,140" marker-end="url(#dm-a)"/>
  <path class="edge" d="M560,240 L668,95" marker-end="url(#dm-a)"/>
  <path class="edge" d="M560,250 L668,230" marker-end="url(#dm-a)"/>
  <path class="edge dash" d="M560,270 L668,370" marker-end="url(#dm-a)"/>
  <text class="t-small" x="620" y="162" text-anchor="middle">run_id</text>
  <text class="t-small" x="615" y="455" text-anchor="middle">Every clean row links back to its raw response and the cycle that produced it, via run_id</text>
</svg>
