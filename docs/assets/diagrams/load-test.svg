<svg class="dg" viewBox="0 0 960 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Load test results: throughput and latency across three cache modes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root {
      --bg:#f7fafb; --surface:#ffffff; --line:#9fb6bc; --text:#16303a; --muted:#5b7680;
      --src:#e9f3ee; --src-line:#58a37b; --core:#e3eff2; --core-line:#2c7486;
      --store:#fbf0dd; --store-line:#d98e1f; --serve:#efeaf7; --serve-line:#7a62b3;
      --arrow:#5b7680; --hot:#d98e1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#151f24; --surface:#1b272d; --line:#3c525a; --text:#e2ecef; --muted:#9ab0b7;
        --src:#16302a; --src-line:#5cc48a; --core:#15313a; --core-line:#4fb3c4;
        --store:#33291a; --store-line:#f0b04f; --serve:#262036; --serve-line:#a58ee0;
        --arrow:#8aa3ab; --hot:#f0b04f;
      }
    }
    .dg-bg   { fill: var(--bg); }
    text     { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); direction: ltr; unicode-bidi: plaintext; }
    .t-title { font-size: 16px; font-weight: 700; }
    .t-body  { font-size: 13px; }
    .t-small { font-size: 11.5px; fill: var(--muted); }
    .t-mono  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--muted); direction: ltr; }
    .t-zone  { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .02em; }
    .box     { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .src     { fill: var(--src);   stroke: var(--src-line);   stroke-width: 1.4; }
    .core    { fill: var(--core);  stroke: var(--core-line);  stroke-width: 1.4; }
    .store   { fill: var(--store); stroke: var(--store-line); stroke-width: 1.4; }
    .serve   { fill: var(--serve); stroke: var(--serve-line); stroke-width: 1.4; }
    .zone    { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
    .edge    { fill: none; stroke: var(--arrow); stroke-width: 1.5; }
    .edge.dash { stroke-dasharray: 5 4; }
    .edge.hot  { stroke: var(--hot); stroke-width: 2; }
    .arrowhead { fill: var(--arrow); }
    .arrowhead.hot { fill: var(--hot); }
    .bar-src   { fill: var(--src-line); }
    .bar-core  { fill: var(--core-line); }
    .bar-store { fill: var(--store-line); }
    .bar-serve { fill: var(--serve-line); }
    .grid-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>
  <rect class="dg-bg" x="0" y="0" width="960" height="250" rx="16"/>
  <!-- left panel: throughput, 20 users; 250 px = 349 req/s -->
  <text class="t-title" x="20" y="30" text-anchor="start">Throughput</text>
  <text class="t-small" x="20" y="50" text-anchor="start">Requests/second, 20 concurrent users (higher is better)</text>
  <line class="grid-line" x1="170" y1="66" x2="170" y2="220"/>
  <text class="t-body" x="20" y="96" text-anchor="start">No cache</text>
  <rect class="bar-store" x="170" y="81" width="35" height="22" rx="4"/>
  <text class="t-body" x="227" y="97" text-anchor="middle">49</text>
  <text class="t-body" x="20" y="146" text-anchor="start">Redis cache</text>
  <rect class="bar-core" x="170" y="131" width="203" height="22" rx="4"/>
  <text class="t-body" x="397" y="147" text-anchor="middle">283</text>
  <text class="t-body" x="20" y="196" text-anchor="start">Redis + ETag</text>
  <text class="t-small" x="20" y="212" text-anchor="start">304 response, no body</text>
  <rect class="bar-core" x="170" y="181" width="250" height="22" rx="4"/>
  <text class="t-body" x="444" y="197" text-anchor="middle">349</text>
  <!-- right panel: median latency, 1 user; 250 px = 37.2 ms -->
  <text class="t-title" x="500" y="30" text-anchor="start">Latency</text>
  <text class="t-small" x="500" y="50" text-anchor="start">Median for one user, ms (lower is better)</text>
  <line class="grid-line" x1="650" y1="66" x2="650" y2="220"/>
  <text class="t-body" x="500" y="96" text-anchor="start">No cache</text>
  <rect class="bar-store" x="650" y="81" width="250" height="22" rx="4"/>
  <text class="t-body" x="924" y="97" text-anchor="middle">37</text>
  <text class="t-body" x="500" y="146" text-anchor="start">Redis cache</text>
  <rect class="bar-core" x="650" y="131" width="30" height="22" rx="4"/>
  <text class="t-body" x="702" y="147" text-anchor="middle">4.4</text>
  <text class="t-body" x="500" y="196" text-anchor="start">Redis + ETag</text>
  <rect class="bar-core" x="650" y="181" width="20" height="22" rx="4"/>
  <text class="t-body" x="692" y="197" text-anchor="middle">2.9</text>
</svg>
