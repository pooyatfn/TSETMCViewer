<svg class="dg" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Time budget for a one-minute cycle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root {
      --bg:#f7fafb; --surface:#ffffff; --line:#9fb6bc; --text:#16303a; --muted:#5b7680;
      --src:#e9f3ee; --src-line:#58a37b; --core:#e3eff2; --core-line:#2c7486;
      --store:#fbf0dd; --store-line:#d98e1f; --serve:#efeaf7; --serve-line:#7a62b3;
      --arrow:#5b7680; --hot:#d98e1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#151f24; --surface:#1b272d; --line:#3c525a; --text:#e2ecef; --muted:#9ab0b7;
        --src:#16302a; --src-line:#5cc48a; --core:#15313a; --core-line:#4fb3c4;
        --store:#33291a; --store-line:#f0b04f; --serve:#262036; --serve-line:#a58ee0;
        --arrow:#8aa3ab; --hot:#f0b04f;
      }
    }
    .dg-bg   { fill: var(--bg); }
    text     { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); direction: ltr; unicode-bidi: plaintext; }
    .t-title { font-size: 16px; font-weight: 700; }
    .t-body  { font-size: 13px; }
    .t-small { font-size: 11.5px; fill: var(--muted); }
    .t-mono  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--muted); direction: ltr; }
    .t-zone  { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .02em; }
    .box     { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .src     { fill: var(--src);   stroke: var(--src-line);   stroke-width: 1.4; }
    .core    { fill: var(--core);  stroke: var(--core-line);  stroke-width: 1.4; }
    .store   { fill: var(--store); stroke: var(--store-line); stroke-width: 1.4; }
    .serve   { fill: var(--serve); stroke: var(--serve-line); stroke-width: 1.4; }
    .zone    { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
    .edge    { fill: none; stroke: var(--arrow); stroke-width: 1.5; }
    .edge.dash { stroke-dasharray: 5 4; }
    .edge.hot  { stroke: var(--hot); stroke-width: 2; }
    .arrowhead { fill: var(--arrow); }
    .arrowhead.hot { fill: var(--hot); }
    .bar-src   { fill: var(--src-line); }
    .bar-core  { fill: var(--core-line); }
    .bar-store { fill: var(--store-line); }
    .bar-serve { fill: var(--serve-line); }
    .grid-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>
  <rect class="dg-bg" x="0" y="0" width="960" height="360" rx="16"/>
  <!-- axis: t=0 at x=180, t=60s at x=840 → 11 px per second (LTR) -->
  <text class="t-title" x="20" y="30" text-anchor="start">One cycle in 60 seconds (real measurement, 2 Mehr 1405)</text>
  <g>
    <line class="grid-line" x1="180" y1="50" x2="180" y2="300"/>
    <line class="grid-line" x1="290" y1="50" x2="290" y2="300"/>
    <line class="grid-line" x1="400" y1="50" x2="400" y2="300"/>
    <line class="grid-line" x1="510" y1="50" x2="510" y2="300"/>
    <line class="grid-line" x1="620" y1="50" x2="620" y2="300"/>
    <line class="grid-line" x1="730" y1="50" x2="730" y2="300"/>
    <line class="grid-line" x1="840" y1="50" x2="840" y2="300"/>
    <text class="t-small" x="180" y="318" text-anchor="middle">0s</text>
    <text class="t-small" x="290" y="318" text-anchor="middle">10</text>
    <text class="t-small" x="400" y="318" text-anchor="middle">20</text>
    <text class="t-small" x="510" y="318" text-anchor="middle">30</text>
    <text class="t-small" x="620" y="318" text-anchor="middle">40</text>
    <text class="t-small" x="730" y="318" text-anchor="middle">50</text>
    <text class="t-small" x="840" y="318" text-anchor="middle">60s</text>
  </g>
  <!-- lanes -->
  <text class="t-body" x="20" y="80" text-anchor="start">Market watch with gzip</text>
  <text class="t-small" x="20" y="95" text-anchor="start">610 KB, 3,845 symbols</text>
  <rect class="bar-src" x="180" y="70" width="11" height="22" rx="5"/>
  <text class="t-body" x="202" y="86" text-anchor="start">1.0s</text>
  <text class="t-body" x="20" y="125" text-anchor="start">Legacy market watch</text>
  <text class="t-small" x="20" y="140" text-anchor="start">425 KB gzip</text>
  <rect class="bar-src" x="180" y="115" width="18" height="22" rx="5"/>
  <text class="t-body" x="210" y="131" text-anchor="start">1.7s</text>
  <text class="t-body" x="20" y="170" text-anchor="start">Retail/institutional, all funds</text>
  <rect class="bar-src" x="180" y="160" width="24" height="22" rx="5"/>
  <text class="t-body" x="216" y="176" text-anchor="start">2.2s</text>
  <text class="t-body" x="20" y="215" text-anchor="start">Net asset value (NAV)</text>
  <text class="t-small" x="20" y="230" text-anchor="start">~160 requests, 8 concurrent</text>
  <rect class="bar-src" x="180" y="205" width="110" height="22" rx="5"/>
  <text class="t-body" x="302" y="221" text-anchor="start">≈ 10s (estimated)</text>
  <text class="t-body" x="20" y="265" text-anchor="start">Store and process</text>
  <rect class="bar-core" x="180" y="255" width="22" height="22" rx="5"/>
  <text class="t-body" x="212" y="271" text-anchor="start">&lt; 2s</text>
  <!-- slack -->
  <rect x="390" y="112" width="440" height="80" rx="12" fill="none" class="zone"/>
  <text class="t-title" x="610" y="148" text-anchor="middle">Safety margin ≈ 45 seconds</text>
  <text class="t-small" x="610" y="172" text-anchor="middle">For retries, TSETMC slowdowns, and fund-count growth</text>
</svg>
