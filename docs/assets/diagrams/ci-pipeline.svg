<svg class="dg" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CI stages: one trigger, three parallel jobs, one smoke test" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root {
      --bg:#f7fafb; --surface:#ffffff; --line:#9fb6bc; --text:#16303a; --muted:#5b7680;
      --src:#e9f3ee; --src-line:#58a37b; --core:#e3eff2; --core-line:#2c7486;
      --store:#fbf0dd; --store-line:#d98e1f; --serve:#efeaf7; --serve-line:#7a62b3;
      --arrow:#5b7680; --hot:#d98e1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#151f24; --surface:#1b272d; --line:#3c525a; --text:#e2ecef; --muted:#9ab0b7;
        --src:#16302a; --src-line:#5cc48a; --core:#15313a; --core-line:#4fb3c4;
        --store:#33291a; --store-line:#f0b04f; --serve:#262036; --serve-line:#a58ee0;
        --arrow:#8aa3ab; --hot:#f0b04f;
      }
    }
    .dg-bg   { fill: var(--bg); }
    text     { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); direction: ltr; unicode-bidi: plaintext; }
    .t-title { font-size: 16px; font-weight: 700; }
    .t-body  { font-size: 13px; }
    .t-small { font-size: 11.5px; fill: var(--muted); }
    .t-mono  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--muted); direction: ltr; }
    .t-zone  { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .02em; }
    .box     { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .src     { fill: var(--src);   stroke: var(--src-line);   stroke-width: 1.4; }
    .core    { fill: var(--core);  stroke: var(--core-line);  stroke-width: 1.4; }
    .store   { fill: var(--store); stroke: var(--store-line); stroke-width: 1.4; }
    .serve   { fill: var(--serve); stroke: var(--serve-line); stroke-width: 1.4; }
    .zone    { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
    .edge    { fill: none; stroke: var(--arrow); stroke-width: 1.5; }
    .edge.dash { stroke-dasharray: 5 4; }
    .edge.hot  { stroke: var(--hot); stroke-width: 2; }
    .arrowhead { fill: var(--arrow); }
    .arrowhead.hot { fill: var(--hot); }
    .bar-src   { fill: var(--src-line); }
    .bar-core  { fill: var(--core-line); }
    .bar-store { fill: var(--store-line); }
    .bar-serve { fill: var(--serve-line); }
    .grid-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>
  <rect class="dg-bg" x="0" y="0" width="960" height="400" rx="16"/>
  <defs>
    <marker id="ci-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ci-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead hot" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <!-- trigger -->
  <rect class="src" x="20" y="160" width="140" height="80" rx="12"/>
  <text class="t-title" x="34" y="192" text-anchor="start">Trigger</text>
  <text class="t-small" x="34" y="214" text-anchor="start">Push to main or a PR</text>
  <!-- parallel jobs -->
  <text class="t-zone" x="200" y="30" text-anchor="start">PARALLEL JOBS</text>
  <rect class="zone" x="190" y="40" width="360" height="330" rx="14"/>
  <rect class="core" x="210" y="56" width="320" height="110" rx="12"/>
  <text class="t-title" x="224" y="84" text-anchor="start">Python</text>
  <text class="t-body" x="224" y="106" text-anchor="start">Checked with ruff, ruff format, and mypy strict</text>
  <text class="t-body" x="224" y="126" text-anchor="start">Unit and integration tests, at least 85% coverage</text>
  <rect class="store" x="224" y="136" width="292" height="22" rx="6"/>
  <text class="t-small" x="232" y="151" text-anchor="start">ClickHouse 24.8 service (same tag as compose)</text>
  <rect class="core" x="210" y="182" width="320" height="80" rx="12"/>
  <text class="t-title" x="224" y="210" text-anchor="start">Web panel</text>
  <text class="t-body" x="224" y="234" text-anchor="start">Type-checked with tsc, vitest tests, and build</text>
  <rect class="core" x="210" y="278" width="320" height="76" rx="12"/>
  <text class="t-title" x="224" y="306" text-anchor="start">Documentation</text>
  <text class="t-body" x="224" y="330" text-anchor="start">Strict mkdocs build: a broken link fails it</text>
  <!-- smoke -->
  <rect class="serve" x="600" y="96" width="340" height="208" rx="12"/>
  <text class="t-title" x="614" y="126" text-anchor="start">Docker smoke test</text>
  <text class="t-small" x="614" y="146" text-anchor="start">Only if Python and panel are green</text>
  <text class="t-body" x="614" y="176" text-anchor="start">1. Build both images (service, panel)</text>
  <text class="t-body" x="614" y="200" text-anchor="start">2. Bring up the stack without the collector</text>
  <text class="t-body" x="614" y="224" text-anchor="start">3. migrate's exit code must be 0</text>
  <text class="t-body" x="614" y="248" text-anchor="start">4. API and nginx health, the /api proxy</text>
  <text class="t-body" x="614" y="272" text-anchor="start">5. The docs site is up</text>
  <!-- edges -->
  <path class="edge" d="M160,190 C180,190 185,111 208,111" marker-end="url(#ci-a)"/>
  <path class="edge" d="M160,200 L208,222" marker-end="url(#ci-a)"/>
  <path class="edge" d="M160,210 C180,210 185,316 208,316" marker-end="url(#ci-a)"/>
  <path class="edge hot" d="M530,111 C565,111 565,170 598,170" marker-end="url(#ci-h)"/>
  <path class="edge hot" d="M530,222 C565,222 565,230 598,230" marker-end="url(#ci-h)"/>
</svg>
