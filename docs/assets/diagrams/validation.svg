<svg class="dg" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Validation stages for each cycle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root {
      --bg:#f7fafb; --surface:#ffffff; --line:#9fb6bc; --text:#16303a; --muted:#5b7680;
      --src:#e9f3ee; --src-line:#58a37b; --core:#e3eff2; --core-line:#2c7486;
      --store:#fbf0dd; --store-line:#d98e1f; --serve:#efeaf7; --serve-line:#7a62b3;
      --arrow:#5b7680; --hot:#d98e1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#151f24; --surface:#1b272d; --line:#3c525a; --text:#e2ecef; --muted:#9ab0b7;
        --src:#16302a; --src-line:#5cc48a; --core:#15313a; --core-line:#4fb3c4;
        --store:#33291a; --store-line:#f0b04f; --serve:#262036; --serve-line:#a58ee0;
        --arrow:#8aa3ab; --hot:#f0b04f;
      }
    }
    .dg-bg   { fill: var(--bg); }
    text     { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); direction: ltr; unicode-bidi: plaintext; }
    .t-title { font-size: 16px; font-weight: 700; }
    .t-body  { font-size: 13px; }
    .t-small { font-size: 11.5px; fill: var(--muted); }
    .t-mono  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--muted); direction: ltr; }
    .t-zone  { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .02em; }
    .box     { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .src     { fill: var(--src);   stroke: var(--src-line);   stroke-width: 1.4; }
    .core    { fill: var(--core);  stroke: var(--core-line);  stroke-width: 1.4; }
    .store   { fill: var(--store); stroke: var(--store-line); stroke-width: 1.4; }
    .serve   { fill: var(--serve); stroke: var(--serve-line); stroke-width: 1.4; }
    .zone    { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
    .edge    { fill: none; stroke: var(--arrow); stroke-width: 1.5; }
    .edge.dash { stroke-dasharray: 5 4; }
    .edge.hot  { stroke: var(--hot); stroke-width: 2; }
    .arrowhead { fill: var(--arrow); }
    .arrowhead.hot { fill: var(--hot); }
    .bar-src   { fill: var(--src-line); }
    .bar-core  { fill: var(--core-line); }
    .bar-store { fill: var(--store-line); }
    .bar-serve { fill: var(--serve-line); }
    .grid-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>
  <rect class="dg-bg" x="0" y="0" width="960" height="360" rx="16"/>
  <defs>
    <marker id="va-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <!-- input -->
  <rect class="src" x="15" y="130" width="105" height="90" rx="10"/>
  <text class="t-title" x="68" y="162" text-anchor="middle">Raw ticks</text>
  <text class="t-title" x="68" y="182" text-anchor="middle">this cycle</text>
  <text class="t-small" x="68" y="204" text-anchor="middle">+ each fund's prior tick</text>
  <!-- stages -->
  <rect class="core" x="140" y="40" width="120" height="270" rx="10"/>
  <text class="t-small" x="200" y="62" text-anchor="middle">1</text>
  <text class="t-title" x="200" y="84" text-anchor="middle">Completeness</text>
  <text class="t-body" x="200" y="118" text-anchor="middle">Missing fund</text>
  <text class="t-body" x="200" y="138" text-anchor="middle">Missed minute</text>
  <text class="t-body" x="200" y="158" text-anchor="middle">Frozen feed</text>
  <line class="grid-line" x1="152" y1="178" x2="248" y2="178"/>
  <text class="t-small" x="200" y="200" text-anchor="middle">Action:</text>
  <text class="t-small" x="200" y="218" text-anchor="middle">carry forward prior value</text>
  <text class="t-small" x="200" y="236" text-anchor="middle">or flag</text>
  <rect class="core" x="275" y="40" width="120" height="270" rx="10"/>
  <text class="t-small" x="335" y="62" text-anchor="middle">2</text>
  <text class="t-title" x="335" y="84" text-anchor="middle">Range</text>
  <text class="t-body" x="335" y="118" text-anchor="middle">Allowed price range</text>
  <text class="t-body" x="335" y="138" text-anchor="middle">Daily high/low</text>
  <line class="grid-line" x1="287" y1="178" x2="383" y2="178"/>
  <text class="t-small" x="335" y="200" text-anchor="middle">Action:</text>
  <text class="t-small" x="335" y="218" text-anchor="middle">prior tick's price</text>
  <text class="t-small" x="335" y="236" text-anchor="middle">or flag</text>
  <rect class="core" x="410" y="40" width="120" height="270" rx="10"/>
  <text class="t-small" x="470" y="62" text-anchor="middle">3</text>
  <text class="t-title" x="470" y="84" text-anchor="middle">Consistency</text>
  <text class="t-body" x="470" y="118" text-anchor="middle">High/low cover the last</text>
  <text class="t-body" x="470" y="138" text-anchor="middle">Cumulative never drops</text>
  <text class="t-body" x="470" y="158" text-anchor="middle">Retail + inst. = volume</text>
  <line class="grid-line" x1="422" y1="178" x2="518" y2="178"/>
  <text class="t-small" x="470" y="200" text-anchor="middle">Action:</text>
  <text class="t-small" x="470" y="218" text-anchor="middle">recompute,</text>
  <text class="t-small" x="470" y="236" text-anchor="middle">prior value, or flag</text>
  <rect class="core" x="545" y="40" width="120" height="270" rx="10"/>
  <text class="t-small" x="605" y="62" text-anchor="middle">4</text>
  <text class="t-title" x="605" y="84" text-anchor="middle">NAV</text>
  <text class="t-body" x="605" y="118" text-anchor="middle">Missing NAV</text>
  <text class="t-body" x="605" y="138" text-anchor="middle">Stale NAV</text>
  <text class="t-body" x="605" y="158" text-anchor="middle">Sudden jump</text>
  <line class="grid-line" x1="557" y1="178" x2="653" y2="178"/>
  <text class="t-small" x="605" y="200" text-anchor="middle">Action:</text>
  <text class="t-small" x="605" y="218" text-anchor="middle">carry forward prior NAV</text>
  <text class="t-small" x="605" y="236" text-anchor="middle">or flag</text>
  <!-- outputs -->
  <rect class="store" x="695" y="60" width="235" height="95" rx="10"/>
  <text class="t-title" x="812" y="88" text-anchor="middle">fund_ticks</text>
  <text class="t-body" x="812" y="112" text-anchor="middle">Corrected value</text>
  <text class="t-small" x="812" y="132" text-anchor="middle">+ a bit in quality_flags</text>
  <rect class="store" x="695" y="190" width="235" height="95" rx="10"/>
  <text class="t-title" x="812" y="218" text-anchor="middle">data_quality_log</text>
  <text class="t-body" x="812" y="242" text-anchor="middle">What it was, what we did</text>
  <text class="t-small" x="812" y="262" text-anchor="middle">One row at each event's start</text>
  <!-- edges -->
  <path class="edge" d="M120,175 L138,175" marker-end="url(#va-a)"/>
  <path class="edge" d="M260,175 L273,175" marker-end="url(#va-a)"/>
  <path class="edge" d="M395,175 L408,175" marker-end="url(#va-a)"/>
  <path class="edge" d="M530,175 L543,175" marker-end="url(#va-a)"/>
  <path class="edge" d="M665,150 L693,110" marker-end="url(#va-a)"/>
  <path class="edge" d="M665,200 L693,235" marker-end="url(#va-a)"/>
  <text class="t-small" x="400" y="340" text-anchor="middle">No correction is silent: every change both flags the row and is logged in the quality report</text>
</svg>
