<svg class="dg" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cache layers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root {
      --bg:#f7fafb; --surface:#ffffff; --line:#9fb6bc; --text:#16303a; --muted:#5b7680;
      --src:#e9f3ee; --src-line:#58a37b; --core:#e3eff2; --core-line:#2c7486;
      --store:#fbf0dd; --store-line:#d98e1f; --serve:#efeaf7; --serve-line:#7a62b3;
      --arrow:#5b7680; --hot:#d98e1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#151f24; --surface:#1b272d; --line:#3c525a; --text:#e2ecef; --muted:#9ab0b7;
        --src:#16302a; --src-line:#5cc48a; --core:#15313a; --core-line:#4fb3c4;
        --store:#33291a; --store-line:#f0b04f; --serve:#262036; --serve-line:#a58ee0;
        --arrow:#8aa3ab; --hot:#f0b04f;
      }
    }
    .dg-bg   { fill: var(--bg); }
    text     { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); direction: ltr; unicode-bidi: plaintext; }
    .t-title { font-size: 16px; font-weight: 700; }
    .t-body  { font-size: 13px; }
    .t-small { font-size: 11.5px; fill: var(--muted); }
    .t-mono  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--muted); direction: ltr; }
    .t-zone  { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .02em; }
    .box     { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .src     { fill: var(--src);   stroke: var(--src-line);   stroke-width: 1.4; }
    .core    { fill: var(--core);  stroke: var(--core-line);  stroke-width: 1.4; }
    .store   { fill: var(--store); stroke: var(--store-line); stroke-width: 1.4; }
    .serve   { fill: var(--serve); stroke: var(--serve-line); stroke-width: 1.4; }
    .zone    { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
    .edge    { fill: none; stroke: var(--arrow); stroke-width: 1.5; }
    .edge.dash { stroke-dasharray: 5 4; }
    .edge.hot  { stroke: var(--hot); stroke-width: 2; }
    .arrowhead { fill: var(--arrow); }
    .arrowhead.hot { fill: var(--hot); }
    .bar-src   { fill: var(--src-line); }
    .bar-core  { fill: var(--core-line); }
    .bar-store { fill: var(--store-line); }
    .bar-serve { fill: var(--serve-line); }
    .grid-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>
  <rect class="dg-bg" x="0" y="0" width="960" height="400" rx="16"/>
  <defs>
    <marker id="ca-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ca-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead hot" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <!-- write side -->
  <rect class="zone" x="15" y="20" width="305" height="360" rx="14"/>
  <text class="t-zone" x="168" y="42" text-anchor="middle">WRITE SIDE (COLLECTOR)</text>
  <rect class="src" x="35" y="60" width="265" height="72" rx="10"/>
  <text class="t-body" x="168" y="86" text-anchor="middle">① In-memory reference cache</text>
  <text class="t-small" x="168" y="106" text-anchor="middle">Fund list and symbol info · once a day</text>
  <text class="t-small" x="168" y="122" text-anchor="middle">120 fewer requests per minute</text>
  <rect class="src" x="35" y="146" width="265" height="72" rx="10"/>
  <text class="t-body" x="168" y="172" text-anchor="middle">② Fetch only changes: rejected</text>
  <text class="t-small" x="168" y="192" text-anchor="middle">With gzip, the full watch feed is 610 KB in 1s</text>
  <text class="t-small" x="168" y="208" text-anchor="middle">Staying stateless is worth 0.6 seconds</text>
  <rect class="store" x="35" y="232" width="265" height="72" rx="10"/>
  <text class="t-body" x="168" y="258" text-anchor="middle">③ Materialized Views</text>
  <text class="t-small" x="168" y="278" text-anchor="middle">Pre-computed aggregation in ClickHouse</text>
  <text class="t-small" x="168" y="294" text-anchor="middle">The panel queries thousands of rows, not millions</text>
  <rect class="core" x="35" y="318" width="265" height="50" rx="10"/>
  <text class="t-body" x="168" y="340" text-anchor="middle">Publish "tick N" on Redis</text>
  <text class="t-small" x="168" y="358" text-anchor="middle">After the minute's data is committed</text>
  <!-- read side -->
  <rect class="zone" x="345" y="20" width="600" height="360" rx="14"/>
  <text class="t-zone" x="645" y="42" text-anchor="middle">READ SIDE (API AND BROWSER)</text>
  <rect class="serve" x="365" y="90" width="250" height="110" rx="10"/>
  <text class="t-body" x="490" y="116" text-anchor="middle">④ Response cache in Redis</text>
  <text class="t-mono" x="490" y="140" text-anchor="middle">key = endpoint : params : tick</text>
  <text class="t-small" x="490" y="162" text-anchor="middle">The key includes the tick number</text>
  <text class="t-small" x="490" y="180" text-anchor="middle">New tick ⇐ new key, no manual eviction</text>
  <rect class="box" x="665" y="90" width="260" height="110" rx="10"/>
  <text class="t-body" x="795" y="116" text-anchor="middle">⑤ Browser HTTP cache</text>
  <text class="t-mono" x="795" y="140" text-anchor="middle">ETag · Cache-Control: max-age</text>
  <text class="t-small" x="795" y="162" text-anchor="middle">Cache lifetime = seconds until next tick</text>
  <text class="t-small" x="795" y="180" text-anchor="middle">304 response with no body</text>
  <rect class="box" x="365" y="250" width="560" height="90" rx="10"/>
  <text class="t-body" x="645" y="278" text-anchor="middle">⑥ Push via SSE</text>
  <text class="t-small" x="645" y="300" text-anchor="middle">The server sends a "tick N" message to open browsers</text>
  <text class="t-small" x="645" y="318" text-anchor="middle">The panel only requests on fresh data, never by polling</text>
  <!-- edges -->
  <path class="edge" d="M300,268 C 330,268 340,160 363,150" marker-end="url(#ca-a)"/>
  <path class="edge" d="M615,145 L663,145" marker-end="url(#ca-a)"/>
  <path class="edge hot" d="M300,343 C 330,343 340,300 363,298" marker-end="url(#ca-h)"/>
  <path class="edge hot dash" d="M490,250 L490,202" marker-end="url(#ca-h)"/>
</svg>
