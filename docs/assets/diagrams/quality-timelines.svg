<svg class="dg" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gap fill and edge-triggered logging" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root {
      --bg:#f7fafb; --surface:#ffffff; --line:#9fb6bc; --text:#16303a; --muted:#5b7680;
      --src:#e9f3ee; --src-line:#58a37b; --core:#e3eff2; --core-line:#2c7486;
      --store:#fbf0dd; --store-line:#d98e1f; --serve:#efeaf7; --serve-line:#7a62b3;
      --arrow:#5b7680; --hot:#d98e1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#151f24; --surface:#1b272d; --line:#3c525a; --text:#e2ecef; --muted:#9ab0b7;
        --src:#16302a; --src-line:#5cc48a; --core:#15313a; --core-line:#4fb3c4;
        --store:#33291a; --store-line:#f0b04f; --serve:#262036; --serve-line:#a58ee0;
        --arrow:#8aa3ab; --hot:#f0b04f;
      }
    }
    .dg-bg   { fill: var(--bg); }
    text     { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); direction: ltr; unicode-bidi: plaintext; }
    .t-title { font-size: 16px; font-weight: 700; }
    .t-body  { font-size: 13px; }
    .t-small { font-size: 11.5px; fill: var(--muted); }
    .t-mono  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--muted); direction: ltr; }
    .t-zone  { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .02em; }
    .box     { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .src     { fill: var(--src);   stroke: var(--src-line);   stroke-width: 1.4; }
    .core    { fill: var(--core);  stroke: var(--core-line);  stroke-width: 1.4; }
    .store   { fill: var(--store); stroke: var(--store-line); stroke-width: 1.4; }
    .serve   { fill: var(--serve); stroke: var(--serve-line); stroke-width: 1.4; }
    .zone    { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
    .edge    { fill: none; stroke: var(--arrow); stroke-width: 1.5; }
    .edge.dash { stroke-dasharray: 5 4; }
    .edge.hot  { stroke: var(--hot); stroke-width: 2; }
    .arrowhead { fill: var(--arrow); }
    .arrowhead.hot { fill: var(--hot); }
    .bar-src   { fill: var(--src-line); }
    .bar-core  { fill: var(--core-line); }
    .bar-store { fill: var(--store-line); }
    .bar-serve { fill: var(--serve-line); }
    .grid-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>
  <rect class="dg-bg" x="0" y="0" width="960" height="300" rx="16"/>
  <!-- time axis labels: minute 10:00 (left) → 10:09 (right) -->
  <text class="t-small" x="120" y="280" text-anchor="middle">10:00</text>
  <text class="t-small" x="190" y="280" text-anchor="middle">10:01</text>
  <text class="t-small" x="260" y="280" text-anchor="middle">10:02</text>
  <text class="t-small" x="330" y="280" text-anchor="middle">10:03</text>
  <text class="t-small" x="400" y="280" text-anchor="middle">10:04</text>
  <text class="t-small" x="470" y="280" text-anchor="middle">10:05</text>
  <text class="t-small" x="540" y="280" text-anchor="middle">10:06</text>
  <text class="t-small" x="610" y="280" text-anchor="middle">10:07</text>
  <text class="t-small" x="680" y="280" text-anchor="middle">10:08</text>
  <text class="t-small" x="750" y="280" text-anchor="middle">10:09</text>
  <!-- row 1: gap fill -->
  <text class="t-title" x="15" y="40" text-anchor="start">Gap fill</text>
  <text class="t-small" x="15" y="58" text-anchor="start">3-minute collector outage</text>
  <line class="grid-line" x1="100" y1="90" x2="770" y2="90"/>
  <circle cx="120" cy="90" r="9" class="bar-core"/>
  <circle cx="190" cy="90" r="9" class="bar-core"/>
  <circle cx="260" cy="90" r="9" class="box"/>
  <circle cx="330" cy="90" r="9" class="box"/>
  <circle cx="400" cy="90" r="9" class="box"/>
  <circle cx="470" cy="90" r="9" class="bar-core"/>
  <circle cx="540" cy="90" r="9" class="bar-core"/>
  <circle cx="610" cy="90" r="9" class="bar-core"/>
  <circle cx="680" cy="90" r="9" class="bar-core"/>
  <circle cx="750" cy="90" r="9" class="bar-core"/>
  <path class="edge dash" d="M190,110 L190,118 L400,118 L400,110"/>
  <text class="t-small" x="295" y="136" text-anchor="middle">Three ticks carry the 10:01 value, flagged FORWARD_FILLED</text>
  <!-- row 2: edge-triggered logging -->
  <text class="t-title" x="15" y="175" text-anchor="start">Edge-triggered logging</text>
  <text class="t-small" x="15" y="193" text-anchor="start">Stale NAV as two separate events</text>
  <line class="grid-line" x1="100" y1="220" x2="770" y2="220"/>
  <rect x="106" y="206" width="28" height="28" rx="6" class="box"/>
  <rect x="176" y="206" width="28" height="28" rx="6" class="bar-store"/>
  <rect x="246" y="206" width="28" height="28" rx="6" class="bar-store"/>
  <rect x="316" y="206" width="28" height="28" rx="6" class="bar-store"/>
  <rect x="386" y="206" width="28" height="28" rx="6" class="box"/>
  <rect x="456" y="206" width="28" height="28" rx="6" class="box"/>
  <rect x="526" y="206" width="28" height="28" rx="6" class="bar-store"/>
  <rect x="596" y="206" width="28" height="28" rx="6" class="bar-store"/>
  <rect x="666" y="206" width="28" height="28" rx="6" class="box"/>
  <rect x="736" y="206" width="28" height="28" rx="6" class="box"/>
  <path class="edge hot" d="M190,234 L190,244"/>
  <circle cx="190" cy="248" r="5" class="arrowhead hot"/>
  <path class="edge hot" d="M540,234 L540,244"/>
  <circle cx="540" cy="248" r="5" class="arrowhead hot"/>
  <text class="t-small" x="190" y="262" text-anchor="middle">One log row</text>
  <text class="t-small" x="540" y="262" text-anchor="middle">One log row</text>
  <!-- legend -->
  <circle cx="840" cy="84" r="7" class="bar-core"/>
  <text class="t-small" x="855" y="88" text-anchor="start">Real tick</text>
  <circle cx="840" cy="108" r="7" class="box"/>
  <text class="t-small" x="855" y="112" text-anchor="start">Filled tick</text>
  <rect x="833" y="206" width="14" height="14" rx="3" class="bar-store"/>
  <text class="t-small" x="855" y="218" text-anchor="start">Flag on tick</text>
  <circle cx="840" cy="242" r="6" class="arrowhead hot"/>
  <text class="t-small" x="855" y="246" text-anchor="start">Log row</text>
</svg>
