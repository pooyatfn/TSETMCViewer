<svg class="dg" viewBox="0 0 960 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Overall service architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root {
      --bg:#f7fafb; --surface:#ffffff; --line:#9fb6bc; --text:#16303a; --muted:#5b7680;
      --src:#e9f3ee; --src-line:#58a37b; --core:#e3eff2; --core-line:#2c7486;
      --store:#fbf0dd; --store-line:#d98e1f; --serve:#efeaf7; --serve-line:#7a62b3;
      --arrow:#5b7680; --hot:#d98e1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#151f24; --surface:#1b272d; --line:#3c525a; --text:#e2ecef; --muted:#9ab0b7;
        --src:#16302a; --src-line:#5cc48a; --core:#15313a; --core-line:#4fb3c4;
        --store:#33291a; --store-line:#f0b04f; --serve:#262036; --serve-line:#a58ee0;
        --arrow:#8aa3ab; --hot:#f0b04f;
      }
    }
    .dg-bg   { fill: var(--bg); }
    text     { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); direction: ltr; unicode-bidi: plaintext; }
    .t-title { font-size: 16px; font-weight: 700; }
    .t-body  { font-size: 13px; }
    .t-small { font-size: 11.5px; fill: var(--muted); }
    .t-mono  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--muted); direction: ltr; }
    .t-zone  { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .02em; }
    .box     { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .src     { fill: var(--src);   stroke: var(--src-line);   stroke-width: 1.4; }
    .core    { fill: var(--core);  stroke: var(--core-line);  stroke-width: 1.4; }
    .store   { fill: var(--store); stroke: var(--store-line); stroke-width: 1.4; }
    .serve   { fill: var(--serve); stroke: var(--serve-line); stroke-width: 1.4; }
    .zone    { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
    .edge    { fill: none; stroke: var(--arrow); stroke-width: 1.5; }
    .edge.dash { stroke-dasharray: 5 4; }
    .edge.hot  { stroke: var(--hot); stroke-width: 2; }
    .arrowhead { fill: var(--arrow); }
    .arrowhead.hot { fill: var(--hot); }
    .bar-src   { fill: var(--src-line); }
    .bar-core  { fill: var(--core-line); }
    .bar-store { fill: var(--store-line); }
    .bar-serve { fill: var(--serve-line); }
    .grid-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
  </style>
  <rect class="dg-bg" x="0" y="0" width="960" height="436" rx="16"/>
  <defs>
    <marker id="arch-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arch-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead hot" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <!-- zones (left → right: sources, ingest, store, serve, present, user) -->
  <rect class="zone" x="10" y="30" width="155" height="370" rx="14"/>
  <text class="t-zone" x="88" y="52" text-anchor="middle">DATA SOURCES</text>
  <rect class="zone" x="180" y="30" width="220" height="370" rx="14"/>
  <text class="t-zone" x="290" y="52" text-anchor="middle">INGEST AND PROCESS</text>
  <rect class="zone" x="415" y="30" width="210" height="370" rx="14"/>
  <text class="t-zone" x="520" y="52" text-anchor="middle">STORAGE</text>
  <rect class="zone" x="640" y="30" width="185" height="370" rx="14"/>
  <text class="t-zone" x="733" y="52" text-anchor="middle">SERVE</text>
  <rect class="zone" x="838" y="30" width="112" height="370" rx="14"/>
  <text class="t-zone" x="894" y="52" text-anchor="middle">USER</text>
  <!-- sources -->
  <rect class="src" x="22" y="80" width="130" height="118" rx="10"/>
  <text class="t-title" x="87" y="106" text-anchor="middle">TSETMC</text>
  <text class="t-small" x="87" y="124" text-anchor="middle">Every minute</text>
  <text class="t-body" x="87" y="148" text-anchor="middle">Market watch</text>
  <text class="t-body" x="87" y="166" text-anchor="middle">Retail / institutional</text>
  <text class="t-body" x="87" y="184" text-anchor="middle">Net asset value (NAV)</text>
  <rect class="src" x="22" y="230" width="130" height="100" rx="10"/>
  <text class="t-title" x="87" y="256" text-anchor="middle">TSETMC</text>
  <text class="t-small" x="87" y="274" text-anchor="middle">Daily, before market open</text>
  <text class="t-body" x="87" y="298" text-anchor="middle">Symbol info</text>
  <text class="t-body" x="87" y="316" text-anchor="middle">Fund type, unit count</text>
  <!-- collector -->
  <rect class="core" x="195" y="70" width="190" height="280" rx="12"/>
  <text class="t-title" x="290" y="96" text-anchor="middle">collector</text>
  <text class="t-small" x="290" y="113" text-anchor="middle">Minute-aligned · asyncio</text>
  <g class="t-body">
    <rect class="box" x="210" y="126" width="160" height="28" rx="7"/>
    <text x="290" y="145" text-anchor="middle">1 – Parallel fetch</text>
    <rect class="box" x="210" y="162" width="160" height="28" rx="7"/>
    <text x="290" y="181" text-anchor="middle">2 – Store raw response</text>
    <rect class="box" x="210" y="198" width="160" height="28" rx="7"/>
    <text x="290" y="217" text-anchor="middle">3 – Parse and filter funds</text>
    <rect class="box" x="210" y="234" width="160" height="28" rx="7"/>
    <text x="290" y="253" text-anchor="middle">4 – Validate and fix</text>
    <rect class="box" x="210" y="270" width="160" height="28" rx="7"/>
    <text x="290" y="289" text-anchor="middle">5 – Batch write</text>
    <rect class="box" x="210" y="306" width="160" height="28" rx="7"/>
    <text x="290" y="325" text-anchor="middle">6 – Announce "new tick"</text>
  </g>
  <!-- ClickHouse -->
  <path class="store" d="M430,92 a90,16 0 0,1 180,0 v250 a90,16 0 0,1 -180,0 z"/>
  <path class="store" d="M430,92 a90,16 0 0,0 180,0"/>
  <text class="t-title" x="520" y="134" text-anchor="middle">ClickHouse</text>
  <text class="t-mono" x="520" y="162" text-anchor="middle">raw_snapshots</text>
  <text class="t-mono" x="520" y="182" text-anchor="middle">fund_ticks</text>
  <text class="t-mono" x="520" y="202" text-anchor="middle">funds · fund_daily</text>
  <text class="t-mono" x="520" y="222" text-anchor="middle">data_quality_log</text>
  <text class="t-mono" x="520" y="242" text-anchor="middle">collection_runs</text>
  <line class="grid-line" x1="450" y1="262" x2="590" y2="262"/>
  <text class="t-body" x="520" y="286" text-anchor="middle">Materialized Views</text>
  <text class="t-small" x="520" y="304" text-anchor="middle">Daily and intraday aggregation</text>
  <!-- serve -->
  <rect class="serve" x="652" y="80" width="160" height="112" rx="10"/>
  <text class="t-title" x="732" y="108" text-anchor="middle">FastAPI</text>
  <text class="t-body" x="732" y="132" text-anchor="middle">REST + SSE</text>
  <text class="t-small" x="732" y="152" text-anchor="middle">Pydantic response validation</text>
  <text class="t-small" x="732" y="170" text-anchor="middle">Automatic Swagger docs</text>
  <rect class="serve" x="652" y="236" width="160" height="96" rx="10"/>
  <text class="t-title" x="732" y="264" text-anchor="middle">Redis</text>
  <text class="t-body" x="732" y="288" text-anchor="middle">Response cache</text>
  <text class="t-small" x="732" y="308" text-anchor="middle">New-tick event channel</text>
  <!-- panel -->
  <rect class="box" x="848" y="120" width="92" height="150" rx="10"/>
  <text class="t-title" x="894" y="150" text-anchor="middle">Web panel</text>
  <text class="t-small" x="894" y="172" text-anchor="middle">React</text>
  <text class="t-small" x="894" y="190" text-anchor="middle">ECharts</text>
  <rect x="868" y="214" width="10" height="34" rx="2" class="bar-serve"/>
  <rect x="884" y="200" width="10" height="48" rx="2" class="bar-src"/>
  <rect x="900" y="222" width="10" height="26" rx="2" class="bar-store"/>
  <rect x="916" y="208" width="10" height="40" rx="2" class="bar-core"/>
  <!-- edges -->
  <path class="edge" d="M152,139 L193,139" marker-end="url(#arch-a)"/>
  <path class="edge dash" d="M152,280 L193,280" marker-end="url(#arch-a)"/>
  <path class="edge" d="M385,210 L428,210" marker-end="url(#arch-a)"/>
  <path class="edge" d="M610,150 L650,150" marker-end="url(#arch-a)"/>
  <path class="edge" d="M812,195 L846,195" marker-end="url(#arch-a)"/>
  <path class="edge dash" d="M732,236 L732,194" marker-end="url(#arch-a)" marker-start="url(#arch-a)"/>
  <!-- tick event: collector → redis (hot) -->
  <path class="edge hot" d="M370,320 C 400,418 620,418 650,300" marker-end="url(#arch-h)"/>
  <text class="t-small" x="505" y="424" text-anchor="middle">Tick event → cache invalidation and push to the panel</text>
</svg>
