# Alertmanager: grouping, silencing and de-duplication. Delivery (Bale, Telegram, any
# webhook) is done by the alert relay (`tsetmc-viewer alert-relay`), so secrets stay in
# .env and messages are formatted in Persian (docs/11-monitoring.md).
route:
  receiver: relay
  group_by: [alertname, component]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: relay
      repeat_interval: 30m

receivers:
  - name: relay
    webhook_configs:
      - url: http://alert-relay:9095/alertmanager
        send_resolved: true
        max_alerts: 20

# A root cause silences its consequences, so one incident = one message.
inhibit_rules:
  - source_matchers: [alertname="ClickHouseDown"]
    target_matchers: [alertname=~"ClickHouseUnavailableForApi|TsetmcDataStale|TsetmcCollectorFailing|TsetmcApiErrors"]
  - source_matchers: [alertname="TsetmcCollectorDown"]
    target_matchers: [alertname=~"TsetmcNoLeader|TsetmcDataStale|TsetmcCollectorFailing"]
  - source_matchers: [alertname="TsetmcCollectorFailing"]
    target_matchers: [alertname=~"TsetmcDataStale|TsetmcSourceErrors|TsetmcLowCompleteness"]
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [component]
