# Prometheus for TSETMCViewer (docs/11-monitoring.md). Started by
#   docker compose --profile monitoring up -d
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: tsetmc-viewer

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Every collector replica (leader and standbys): DNS returns one A record per container.
  - job_name: collector
    dns_sd_configs:
      - names: ["collector"]
        type: A
        port: 9108
        refresh_interval: 30s

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # ClickHouse's built-in endpoint (docker/clickhouse/prometheus.xml).
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  - job_name: alert-relay
    static_configs:
      - targets: ["alert-relay:9095"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
