[project]
name = "tsetmc-viewer"
version = "0.1.0"
description = "Live collection, cleaning and analytics of Iranian equity ETFs from TSETMC."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "clickhouse-connect[async]>=0.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tzdata>=2024.1",
    "redis>=5.0",
    "prometheus-client>=0.26.0",
]

[project.scripts]
tsetmc-viewer = "tsetmc_viewer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "fakeredis[lua]>=2.23",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs>=1.6,<2",  # MkDocs 2.0 drops the plugin/theme system Material relies on
]

[tool.uv]
# `uv sync` (make install) also installs the docs toolchain: `make docs` / `make check` need it.
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsetmc_viewer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Persian text is intentional

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["tsetmc_viewer"]

[[tool.mypy.overrides]]
module = ["clickhouse_connect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["integration: needs a running ClickHouse (set CLICKHOUSE_HOST)"]

[tool.coverage.run]
source = ["tsetmc_viewer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85  # measured 90% with integration tests (Day 6); CI runs them on real ClickHouse
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]
